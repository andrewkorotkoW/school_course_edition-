<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EduQuest — Вариант A: SVG-парк с единой дорожкой</title>
<style>
  /* Палитра и шрифт скопированы из frontend/app/globals.css (инлайн, без подключения файла) */
  :root {
    --color-bg: #fff8ef;
    --color-surface: #ffffff;
    --color-primary: #ff7a3d;
    --color-primary-dark: #cc4a1f;
    --color-secondary: #2fa88a;
    --color-accent: #ffc94d;
    --color-text: #3a2e26;
    --color-text-muted: #6b5c50;
    --color-border: #f1e2cf;
    --color-success: #227863;
    --color-success-bg: #e4f7f0;
    --color-error: #c4291d;
    --color-error-bg: #fdeceb;

    --space-xs: 0.5rem;
    --space-sm: 0.75rem;
    --space-md: 1.25rem;
    --space-lg: 2rem;
    --space-xl: 3rem;

    --radius-sm: 0.75rem;
    --radius-md: 1.25rem;
    --radius-pill: 999px;

    --shadow-sm: 0 2px 6px rgba(58, 46, 38, 0.08);
    --shadow-md: 0 8px 24px rgba(58, 46, 38, 0.12);
    --shadow-lift: 0 14px 30px rgba(58, 46, 38, 0.18);

    --font-sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: var(--space-lg) var(--space-md) var(--space-xl);
  }

  .page-header {
    margin-bottom: var(--space-lg);
  }

  .mockup-tag {
    display: inline-block;
    margin-bottom: var(--space-xs);
    padding: 0.2rem 0.7rem;
    border-radius: var(--radius-pill);
    background: var(--color-accent);
    color: var(--color-text);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .page-title {
    margin: 0 0 var(--space-xs);
    font-size: 1.9rem;
    color: var(--color-primary-dark);
  }

  .page-subtitle {
    margin: 0;
    color: var(--color-text-muted);
    font-size: 1rem;
  }

  .scene-card {
    background: var(--color-surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    padding: var(--space-sm);
    overflow: hidden;
  }

  .scene-svg-wrap {
    width: 100%;
    line-height: 0;
  }

  .scene-svg-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Легенда состояний узлов */

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-md);
    margin-top: var(--space-lg);
    padding: var(--space-md);
    background: var(--color-surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    font-size: 0.9rem;
    color: var(--color-text-muted);
  }

  .legend-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: #fff;
  }

  .legend-swatch-completed {
    background: var(--color-success);
  }

  .legend-swatch-current {
    background: var(--color-primary);
    animation: legend-pulse 1.6s ease-in-out infinite;
  }

  .legend-swatch-locked {
    background: var(--color-border);
    color: var(--color-text-muted);
  }

  @keyframes legend-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* --- Сцена: SVG-парк --- */

  .node-label-bg {
    fill: var(--color-surface);
    opacity: 0.92;
  }

  .node-label-text {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 600;
    fill: var(--color-text);
  }

  .node-grade-text {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    fill: var(--color-text-muted);
  }

  .path-line {
    fill: none;
    stroke: #e8dcb8;
    stroke-width: 22;
    stroke-linecap: round;
  }

  .path-line-dashes {
    fill: none;
    stroke: #c9b685;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 2 20;
  }

  /* Узел: пройден — приглушённые тона, галочка */

  .map-node-completed .node-badge-fill {
    fill: var(--color-success-bg);
    stroke: var(--color-success);
    stroke-width: 3;
  }

  .map-node-completed .node-badge-icon {
    fill: var(--color-success);
  }

  .map-node-completed .node-label-text {
    color: var(--color-text-muted);
  }

  /* Узел: следующий доступный — выделен, едва заметно пульсирует */

  .map-node-current .node-badge-fill {
    fill: var(--color-primary);
    stroke: var(--color-accent);
    stroke-width: 4;
  }

  .map-node-current .node-badge-icon {
    fill: #ffffff;
  }

  .map-node-current .node-label-text {
    fill: var(--color-primary-dark);
    font-weight: 700;
  }

  .map-node-current .node-badge-group {
    transform-box: fill-box;
    transform-origin: center;
    animation: node-pulse 2.2s ease-in-out infinite;
  }

  .map-node-current .node-glow {
    fill: none;
    stroke: var(--color-primary);
    opacity: 0.35;
    stroke-width: 3;
    transform-box: fill-box;
    transform-origin: center;
    animation: node-glow-pulse 2.2s ease-in-out infinite;
  }

  @keyframes node-pulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.07) rotate(-2deg); }
  }

  @keyframes node-glow-pulse {
    0% { transform: scale(1); opacity: 0.35; }
    50% { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* Узел: заперт — приглушён, замочек */

  .map-node-locked .node-badge-fill {
    fill: var(--color-border);
    stroke: #d8c7a8;
    stroke-width: 3;
  }

  .map-node-locked .node-badge-icon {
    fill: var(--color-text-muted);
  }

  .map-node-locked .node-group {
    opacity: 0.62;
  }

  .map-node-locked .node-label-text {
    fill: var(--color-text-muted);
    font-weight: 600;
  }

  /* Облака — едва заметный дрейф */

  .cloud {
    fill: #fffaf0;
    opacity: 0.9;
  }

  .cloud-1 {
    animation: cloud-drift-1 18s ease-in-out infinite alternate;
  }

  .cloud-2 {
    animation: cloud-drift-2 24s ease-in-out infinite alternate;
  }

  .cloud-3 {
    animation: cloud-drift-3 21s ease-in-out infinite alternate;
  }

  @keyframes cloud-drift-1 {
    from { transform: translateX(-14px); }
    to { transform: translateX(14px); }
  }

  @keyframes cloud-drift-2 {
    from { transform: translateX(10px); }
    to { transform: translateX(-16px); }
  }

  @keyframes cloud-drift-3 {
    from { transform: translateX(-8px); }
    to { transform: translateX(12px); }
  }

  /* Вода — едва заметное мерцание бликов */

  .water-shimmer {
    animation: shimmer 5s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }

  @media (max-width: 480px) {
    .page {
      padding: var(--space-md) var(--space-sm) var(--space-lg);
    }

    .page-title {
      font-size: 1.5rem;
    }

    .page-subtitle {
      font-size: 0.9rem;
    }

    .scene-card {
      padding: var(--space-xs);
      border-radius: var(--radius-sm);
    }

    .node-label-text {
      font-size: 26px;
    }

    .node-grade-text {
      font-size: 17px;
    }

    .legend {
      flex-direction: column;
      gap: var(--space-sm);
    }
  }
</style>
</head>
